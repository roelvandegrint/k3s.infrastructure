apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: first-secret
spec:
  # refreshInterval: 1h0m0s
  secretStoreRef:
    kind: SecretStore
    name: azure-store

  target:
    name: first-secret
    creationPolicy: Owner

  data:
    # name of the SECRET in the Azure KV (no prefix is by default a SECRET)
    - secretKey: first-secret
      remoteRef:
        key: first-secret
