apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: external-secrets-operator-demo
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: platform

  sources:
    - repoURL: https://github.com/roelvandegrint/k3s.infrastructure.git
      targetRevision: external-secrets
      path: external-secrets/demo

  destination:
    server: https://kubernetes.default.svc
    namespace: external-secrets-demo

  syncPolicy:
    automated:
      enabled: false
      prune: false
      selfHeal: false
    syncOptions:
      - PruneLast=true
      - ServerSideApply=true
