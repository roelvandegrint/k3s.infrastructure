apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kyverno
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: platform

  sources:
    - path: .
      repoURL: https://kyverno.github.io/kyverno/
      targetRevision: 3.9.1
      helm:
        valueFiles:
          - $values/kyverno/helm/values.yaml

    - repoURL: https://github.com/roelvandegrint/k3s.infrastructure.git
      targetRevision: kyverno
      ref: values

    - repoURL: https://github.com/roelvandegrint/k3s.infrastructure.git
      targetRevision: kyverno
      path: kyverno

  destination:
    server: "https://kubernetes.default.svc"
    namespace: kyverno

  syncPolicy:
    automated:
      enabled: true
      prune: true
      selfHeal: true
    syncOptions:
      - PruneLast=true
      - ServerSideApply=true
