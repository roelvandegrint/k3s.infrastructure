apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: argocd

resources:
  - https://raw.githubusercontent.com/argoproj/argo-cd/v3.4.4/manifests/install.yaml
  - argocd-internet.ingress.yaml
  - certmanager-letsencrypt-production.issuer.yaml

components: []

patches:
  - path: patch-argocd-cm.configmap.yaml
  - path: patch-argocd-cmd-params-cm.configmap.yaml
  - path: patch-argocd-rbac-cm.configmap.yaml
  - path: patch-argocd-repo-server.deployment.yaml
